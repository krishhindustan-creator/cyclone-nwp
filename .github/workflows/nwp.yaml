name: Cyclone NWP (ECMWF ENS + IMD MME 7)

on:
  schedule:
    # 00 UTC run: 05 UTC (GFS, CMC, IMD) · 08 UTC (+ ECMWF HRES/ENS) · 09 UTC (late models)
    - cron: "0 5 * * *"      # 10:30 IST
    - cron: "0 8 * * *"      # 13:30 IST
    - cron: "0 9 * * *"      # 14:30 IST
    # 12 UTC run: 17 UTC · 20 UTC (+ ECMWF) · 21 UTC (late models)
    - cron: "0 17 * * *"     # 22:30 IST
    - cron: "0 20 * * *"     # 01:30 IST
    - cron: "0 21 * * *"     # 02:30 IST
    # District rainfall only (quick runs, every 30 min while the models release a new 00 / 12 UTC run:
    # GFS, AIGFS, ICON, GDPS, ARPEGE from about +3.5 h, ECMWF IFS / AIFS from about +6.5 h)
    - cron: "10,40 3-10 * * *"
    - cron: "10,40 15-22 * * *"
  workflow_dispatch:
    inputs:
      run_id: {description: "Run YYYYMMDDHH (empty = latest)", required: false, default: ""}
      force:  {description: "Redo even if already on the site (1 = yes)", required: false, default: "0"}

permissions:
  contents: write

concurrency:
  group: nwp
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install
        run: pip install eccodes cartopy paramiko h5py scipy shapely pandas matplotlib
      - name: Current web site (gh-pages branch)
        run: |
          git clone --depth 1 -b gh-pages "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site \
            || mkdir -p site
          rm -rf site/.git
      - name: Run ECMWF ENS and MME 7
        if: ${{ !contains(github.event.schedule, '10,40') }}
        env:
          RUN_ID:  ${{ github.event.inputs.run_id }}
          FORCE:   ${{ github.event.inputs.force }}
          IMD_PWD: ${{ secrets.IMD_PWD }}
          IMD_MODELS: "on"       # IMD GFS, NCUM-G, NCUM-R from IMD's dr_krishna folder ("off" to skip them)
          IMD_MAX_MINUTES: "10"  # if IMD's server is slow, give up on the IMD models after 10 min
          KEEP_DAYS: "15"
        run: python nwp_runner.py
      - name: Add district rainfall pages
        run: cp *.html india_districts.geojson imd_subdivisions.json site/ || echo "district files not found"
      - name: District rainfall (10 models + MME; maximum over each district)
        continue-on-error: true
        timeout-minutes: 60
        env:
          FORCE:  ${{ github.event.inputs.force }}
          RUN_ID: ${{ github.event.inputs.run_id }}
          MODELS: "IFS,AIFS,GFS,AIGFS,ICON,GDPS,ARPEGE,IMDGFS,NCUMG,NCUMR"
          IMD_PWD: ${{ secrets.IMD_PWD }}   # same IMD SFTP login as the cyclone MME
          KEEP_DAYS: "7"
        run: |
          pip install ecmwf-opendata
          python district_runner.py
      - name: Ensemble District R/F Probability (ECMWF ENS + GEFS + GEPS)
        continue-on-error: true
        timeout-minutes: 45
        env:
          ENSEMBLES: "ECMWF,GEFS,GEPS"
          FORCE:  ${{ github.event.inputs.force }}
          RUN_ID: ${{ github.event.inputs.run_id }}
          KEEP_DAYS: "7"
        run: python ens_district_runner.py
      - name: Subdivisional Forecast - Tmax / Tmin (7 global models; rainfall comes from the district files)
        continue-on-error: true
        timeout-minutes: 45
        env:
          TMODELS: "IFS,AIFS,GFS,AIGFS,ICON,GDPS,ARPEGE"
          FORCE:  ${{ github.event.inputs.force }}
          RUN_ID: ${{ github.event.inputs.run_id }}
          KEEP_DAYS: "7"
        run: python subdiv_temp_runner.py
      - name: Verification archive (branch verif-archive, kept for ever)
        continue-on-error: true
        run: |
          git clone -q --depth 1 -b verif-archive "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" archive \
            || (mkdir -p archive && cd archive && git init -q -b verif-archive)
      - name: Verification (IMD gridded rainfall)
        continue-on-error: true
        timeout-minutes: 15
        env:
          VERIF_ARCHIVE: archive
        run: |
          pip install imdlib
          python verif_runner.py
      - name: Track verification (cyclone forecasts vs best track)
        if: ${{ !contains(github.event.schedule, '10,40') }}
        continue-on-error: true
        timeout-minutes: 15
        env:
          VERIF_ARCHIVE: archive
        run: python track_verif.py
      - name: Save the verification archive
        continue-on-error: true
        run: |
          cd archive
          git config user.name  "nwp-bot"
          git config user.email "nwp-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "archive unchanged"; exit 0; fi
          git commit -q -m "Verification archive $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" verif-archive
      - name: Tab name (MME District Rainfall Forecast)
        run: |
          [ -f site/index.html ] && sed -i 's/ECMWF District Rainfall\( Forecast\)\?/MME District Rainfall Forecast/g' site/index.html || true
      - name: Publish (gh-pages, no history so old runs do not pile up)
        run: |
          if [ "${{ contains(github.event.schedule, '10,40') }}" = "true" ] && [ ! -f work/district_changed ]; then
            echo "Nothing new for the site - not publishing"
            exit 0
          fi
          cd site
          git init -q -b gh-pages
          git config user.name  "nwp-bot"
          git config user.email "nwp-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
