name: T-phi grams (IMD RS/RW)

on:
  schedule:
    - cron: "0 2 * * *"      # 07:30 IST
    - cron: "30 3 * * *"     # 09:00 IST (late-uploaded stations)
    - cron: "0 14 * * *"     # 19:30 IST
    - cron: "30 15 * * *"    # 21:00 IST (late-uploaded stations)
  workflow_dispatch:
    inputs:
      backfill_days: {description: "Fill in the last N days (0 = normal run, max 9)", required: false, default: "0"}
      only:          {description: "Only these station indices, e.g. 42182 for New Delhi (empty = all stations)", required: false, default: ""}

permissions:
  contents: read

concurrency:
  group: tphi
  cancel-in-progress: false

jobs:
  tphi:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install
        run: pip install numpy matplotlib requests pillow
      - name: Download, plot and publish the T-phi grams
        env:
          RSRW_CONFIG: ${{ secrets.RSRW_CONFIG }}   # the whole content of rsrw_config.json (CLIMS login + GitHub token)
          RSRW_KEEP_REMOTE: "1"                     # keep the charts already on the web page (this computer starts empty)
          RSRW_BACKFILL_DAYS: ${{ github.event.inputs.backfill_days }}   # 'Run workflow' input (empty on scheduled runs)
          RSRW_ONLY: ${{ github.event.inputs.only }}                     # 'Run workflow' input (empty on scheduled runs)
          TZ: Asia/Kolkata                          # times on the page in IST
        run: |
          mkdir -p tphi && cp rsrw_tphigrams.py rsrw_delhi.py tphi/ && cd tphi
          printf '%s' "$RSRW_CONFIG" > rsrw_config.json
          python rsrw_tphigrams.py --auto
